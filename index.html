<style>

<div id="app"><div class="loading">جارٍ التحميل…</div></div>

<script>
(function(){
"use strict";
const CFG = window.SD_CONFIG;
const LIVE_READY = !!(CFG.SUPABASE_URL && CFG.SUPABASE_ANON_KEY);
const $app = document.getElementById("app");

/* ---------------- helpers ---------------- */
const esc = v => String(v == null ? "" : v).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const iso = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseISO = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d, 12); };
const addDays = (s, n) => { const d = parseISO(s); d.setDate(d.getDate()+n); return iso(d); };
const fmt = (s, opt) => { try { return new Intl.DateTimeFormat("ar-SA-u-ca-gregory-nu-latn", opt).format(parseISO(s)); } catch(e){ return s; } };
const hijri = s => { try { return new Intl.DateTimeFormat("ar-SA-u-ca-islamic-umalqura-nu-latn",{day:"numeric",month:"long",year:"numeric"}).format(parseISO(s)); } catch(e){ return ""; } };
const weekday = s => fmt(s,{weekday:"long"});
const hm = t => (t||"").slice(0,5);
const nowHM = () => { const d = new Date(); return pad(d.getHours())+":"+pad(d.getMinutes()); };
const TYPE_AR = {late:"تأخر", absent:"غياب", violation:"مخالفة"};
const ROLE_AR = {admin:"المدير", deputy:"الوكيل", counselor:"الموجه الطلابي"};
const ls = {
  get(k, d){ try { const v = localStorage.getItem("sd:"+k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem("sd:"+k, JSON.stringify(v)); } catch(e){} }
};
const ss = {
  get(k){ try { return sessionStorage.getItem("sd:"+k); } catch(e){ return null; } },
  set(k, v){ try { v == null ? sessionStorage.removeItem("sd:"+k) : sessionStorage.setItem("sd:"+k, v); } catch(e){} }
};

/* ---------------- icons ---------------- */
const I = {
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
  att:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/></svg>',
  cover:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 7h11M7 7l3-3M7 7l3 3M17 17H6m11 0l-3-3m3 3l-3 3"/></svg>',
  sup:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/></svg>',
  beh:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 21V4m0 0h11l-2 4 2 4H5"/></svg>',
  rep:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 20V10m7 10V4m7 16v-7"/></svg>'
};
const ROUTES = [
  ["home","اليوم",I.home], ["attendance","الغياب والتأخر",I.att], ["covers","الانتظار",I.cover],
  ["supervision","الإشراف",I.sup], ["behavior","المتابعة السلوكية",I.beh], ["reports","التقارير",I.rep]
];

/* ---------------- data access ---------------- */
async function rpcLive(fn, args){
  const r = await fetch(CFG.SUPABASE_URL.replace(/\/$/,"") + "/rest/v1/rpc/" + fn, {
    method:"POST",
    headers:{ "Content-Type":"application/json", apikey:CFG.SUPABASE_ANON_KEY, Authorization:"Bearer "+CFG.SUPABASE_ANON_KEY },
    body: JSON.stringify(args || {})
  });
  const txt = await r.text(); let j = null;
  try { j = txt ? JSON.parse(txt) : null; } catch(e){ j = txt; }
  if(!r.ok){
    const e = new Error((j && j.message) || ("HTTP " + r.status));
    e.status = r.status; e.code = j && j.code; throw e;
  }
  return j;
}
const isMissingFn = e => e && (e.code === "PGRST202" || e.status === 404);
const isUnauth = e => e && /unauthorized/i.test(e.message || "");

const S = { mode:null, token:null, role:null, name:"", t:null, dash:null, gate:null, today:null, err:null, range:{} };

function rpc(fn, args){ return S.mode === "demo" ? Promise.resolve(DEMO.rpc(fn, args)) : rpcLive(fn, args); }

async function loadCore(){
  S.err = null;
  try {
    S.t = await rpc("pt_admin_data", {p_token:S.token});
  } catch(e){
    if(isUnauth(e)){ logout(true); return false; }
    S.err = "تعذّر قراءة بيانات بوابة المعلم: " + e.message; S.t = null; return true;
  }
  S.role = S.t.role || S.role;
  S.today = S.t.today || iso(new Date());
  const today = S.today;
  const [dash, gate] = await Promise.allSettled([
    rpc("pt_admin_dashboard", {p_token:S.token, p_from:today, p_to:today}),
    rpc("sd_gate_summary", {p_token:S.token, p_date:today})
  ]);
  S.dash = dash.status === "fulfilled" ? dash.value : null;
  if(gate.status === "fulfilled") S.gate = gate.value;
  else S.gate = { missing: isMissingFn(gate.reason), error: gate.reason && gate.reason.message };
  return true;
}

/* ---------------- derived data ---------------- */
const teacherName = id => { const t = (S.t.teachers||[]).find(x => x.id === id); return t ? t.name : "—"; };
function isHoliday(d){ return (S.t.holidays||[]).find(h => h.start_date <= d && d <= h.end_date); }
function isSchoolDay(d){
  const wd = parseISO(d).getDay();
  const days = (S.t.settings && S.t.settings.week_days) || [0,1,2,3,4];
  return days.includes(wd) && !isHoliday(d);
}
function coversFor(d){
  return (S.t.assignments||[]).filter(a => a.kind === "cover" && a.date === d)
    .sort((a,b) => (a.lesson_no||0) - (b.lesson_no||0));
}
function absencesFor(d){ return (S.t.absences||[]).filter(a => a.date === d); }
function uncoveredFor(d){
  const wd = parseISO(d).getDay();
  const covers = coversFor(d), out = [];
  absencesFor(d).forEach(ab => {
    (S.t.schedule||[]).filter(s => s.teacher_id === ab.teacher_id && s.day === wd
        && (s.kind || "class") === "class" && s.class_name
        && (!ab.from_lesson || s.lesson_no >= ab.from_lesson))
      .forEach(s => {
        const ok = covers.some(c => c.lesson_no === s.lesson_no && (c.absence_id === ab.id || c.class_name === s.class_name));
        if(!ok) out.push({teacher:teacherName(ab.teacher_id), lesson_no:s.lesson_no, class_name:s.class_name, subject:s.subject});
      });
  });
  return out.sort((a,b) => a.lesson_no - b.lesson_no);
}
function rotaFor(d){ return (S.t.rota||[]).filter(r => r.start_date <= d && d <= r.end_date); }
function dutiesFor(d){ const wd = parseISO(d).getDay(); return (S.t.duties||[]).filter(x => x.day === wd); }
function announcementsFor(d){ return (S.t.announcements||[]).filter(a => (!a.from_date || a.from_date <= d) && (!a.until_date || d <= a.until_date)); }
function currentLesson(){
  const t = nowHM();
  return (S.t.periods||[]).find(p => hm(p.start_time) <= t && t < hm(p.end_time));
}

  return `<div class="notice err">تعذّر قراءة بيانات الحضور: ${esc(S.gate.error)}</div>`;
}

/* ---------- range loader (attendance / behavior / reports) ---------- */
async function loadRange(from, to){
  if(!gateOK()) return null;
  const key = from + "|" + to;
  if(S.range[key]) return S.range[key];
  const rows = await rpc("sd_gate_records", {p_token:S.token, p_from:from, p_to:to});
  S.range = {}; S.range[key] = rows || [];
  return S.range[key];
}
function rangeTools(id, from, to, extra){
  return `<div class="tools" id="${id}">
    <label class="field">من<input type="date" name="from" value="${esc(from)}"></label>
    <label class="field">إلى<input type="date" name="to" value="${esc(to)}"></label>
    ${extra||""}
    <div class="end"><button class="btn" type="button" data-act="print">طباعة</button><button class="btn" type="button" data-act="csv">تصدير CSV</button></div>
  </div>`;
}
function printHead(title, from, to){
  const school = (S.t.settings && S.t.settings.school_name) || "";
  return `<div class="print-head"><b>${esc(school)}</b> — ${esc(title)}<br>${from===to ? esc(fmt(from,{weekday:"long",day:"numeric",month:"long",year:"numeric"})) : "من "+esc(from)+" إلى "+esc(to)}${S.mode==="demo"?" — بيانات وهمية":""}</div>`;
}
function downloadCSV(name, head, rows){
  const q = v => '"' + String(v == null ? "" : v).replace(/"/g,'""') + '"';
  const txt = "\uFEFF" + [head].concat(rows).map(r => r.map(q).join(",")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([txt], {type:"text/csv;charset=utf-8"}));
  a.download = name + ".csv"; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
const classLabel = r => [r.grade, r.cls].filter(Boolean).join(" / ");
function classOptions(rows, sel){
  const set = [...new Set(rows.map(classLabel).filter(Boolean))].sort();
  return `<option value="">كل الفصول</option>` + set.map(c => `<option ${c===sel?"selected":""}>${esc(c)}</option>`).join("");
}

      <option value="unexcused" ${AV.type==="unexcused"?"selected":""}>غياب بلا عذر</option><option value="excused" ${AV.type==="excused"?"selected":""}>غياب بعذر</option></select></label>

    + rangeTools("att-tools", AV.from, AV.to, extra) + printHead("الغياب والتأخر", AV.from, AV.to)
    + `<div class="tbl-wrap"><table><thead><tr><th>التاريخ</th><th>الطالب</th><th>الفصل</th><th>النوع</th><th>الوقت</th><th>العذر</th><th>الإشعار</th></tr></thead><tbody>

    </tbody></table></div><div class="count-line">${f.length} سجل</div>`;

function bindRangeTools(id, st, rerender){
  const box = document.getElementById(id); if(!box) return;

    const ev = el.type === "search" ? "input" : "change";

const RV = { from:null, to:null, thLate:null, thAbs:null, onlyFlag:false, q:"" };
async function pageReports(){
  if(!RV.from){
    const firstRota = (S.t.rota||[]).map(r => r.start_date).sort()[0];
    RV.from = ls.get("termStart", firstRota && firstRota < S.today ? firstRota : addDays(S.today,-30));
    if(RV.from > S.today || RV.from < addDays(S.today,-190)) RV.from = addDays(S.today,-30);
  }
  RV.to = RV.to || S.today;
  if(RV.thLate == null) RV.thLate = ls.get("thLate", 5);
  if(RV.thAbs == null) RV.thAbs = ls.get("thAbs", 5);
  if(!gateOK()) return head("التقارير","") + gateNotice();
  let rows;
  try { rows = await loadRange(RV.from, RV.to); } catch(e){ return head("التقارير","") + `<div class="notice err">${esc(e.message === "range_too_large" ? "المدة طويلة؛ اختر 190 يومًا أو أقل." : e.message)}</div>`; }
  const byDay = {}, byStu = {};
  rows.forEach(r => {
    const d = byDay[r.date] = byDay[r.date] || {late:0, abs:0, exc:0, vio:0};
    const k = r.sid || r.name;
    const s = byStu[k] = byStu[k] || {name:r.name, cls:classLabel(r), late:0, abs:0, exc:0, vio:0};
    if(r.type === "late"){ d.late++; s.late++; }
    else if(r.type === "absent"){ if(r.excused){ d.exc++; s.exc++; } else { d.abs++; s.abs++; } }
    else if(r.type === "violation"){ d.vio++; s.vio++; }
  });
  const stu = Object.values(byStu).map(s => Object.assign(s, {flag: s.late >= RV.thLate || s.abs >= RV.thAbs}))
    .filter(s => (!RV.onlyFlag || s.flag) && (!RV.q || s.name.includes(RV.q)))
    .sort((a,b) => (b.flag - a.flag) || (b.abs + b.late) - (a.abs + a.late));
  const days = Object.keys(byDay).sort().reverse();
  const flagged = Object.values(byStu).filter(s => s.late >= RV.thLate || s.abs >= RV.thAbs).length;
  S._csv = () => downloadCSV("تقرير-الطلاب-"+RV.from+"-"+RV.to, ["الطالب","الفصل","تأخر","غياب بلا عذر","غياب بعذر","مخالفات","بلغ حد الإحالة"],
    stu.map(s => [s.name, s.cls, s.late, s.abs, s.exc, s.vio, s.flag?"نعم":""]));
  const extra = `<label class="field">حد التأخر<input type="number" min="1" name="thLate" value="${esc(RV.thLate)}"></label>
    <label class="field">حد الغياب بلا عذر<input type="number" min="1" name="thAbs" value="${esc(RV.thAbs)}"></label>
    <label class="field">العرض<select name="onlyFlag"><option value="">كل الطلاب</option><option value="1" ${RV.onlyFlag?"selected":""}>من بلغ حد الإحالة فقط</option></select></label>
    <label class="field grow">بحث بالاسم<input type="search" name="q" value="${esc(RV.q)}" placeholder="اسم الطالب"></label>`;
  return head("التقارير","ملخص من سجلات بوابة الحضور. حدّا الإحالة قابلان للتعديل ويُحفظان في هذا المتصفح فقط.")
    + rangeTools("rp-tools", RV.from, RV.to, extra) + printHead("تقرير الحضور والسلوك", RV.from, RV.to)
    + `<div class="tally"><div class="late"><div class="n">${rows.filter(r=>r.type==="late").length}</div><div class="l">تأخر</div></div>
       <div class="absent"><div class="n">${rows.filter(r=>r.type==="absent"&&!r.excused).length}</div><div class="l">غياب بلا عذر</div></div>
       <div class="exc"><div class="n">${rows.filter(r=>r.type==="absent"&&r.excused).length}</div><div class="l">غياب بعذر</div></div>
       <div class="viol"><div class="n">${flagged}</div><div class="l">بلغوا حد الإحالة</div></div></div>
      <section class="panel"><h2>حسب الطالب <span class="meta">${stu.length}</span></h2><div class="tbl-wrap"><table><thead><tr><th>الطالب</th><th>الفصل</th><th>تأخر</th><th>غياب بلا عذر</th><th>غياب بعذر</th><th>مخالفات</th><th></th></tr></thead><tbody>
      ${stu.map(s => `<tr class="${s.flag?"flag":""}"><td>${esc(s.name)}</td><td>${esc(s.cls)}</td><td class="num">${s.late}</td><td class="num">${s.abs}</td><td class="num">${s.exc}</td><td class="num">${s.vio}</td><td>${s.flag?'<span class="tag absent">للإحالة</span>':""}</td></tr>`).join("") || '<tr><td colspan="7" class="empty">لا توجد بيانات.</td></tr>'}
      </tbody></table></div></section>
      <section class="panel"><h2>حسب اليوم</h2><div class="tbl-wrap"><table><thead><tr><th>اليوم</th><th>التاريخ</th><th>تأخر</th><th>غياب بلا عذر</th><th>غياب بعذر</th><th>مخالفات</th></tr></thead><tbody>
      ${days.map(d => `<tr><td>${esc(weekday(d))}</td><td>${esc(d)}</td><td class="num">${byDay[d].late}</td><td class="num">${byDay[d].abs}</td><td class="num">${byDay[d].exc}</td><td class="num">${byDay[d].vio}</td></tr>`).join("") || '<tr><td colspan="6" class="empty">لا توجد بيانات.</td></tr>'}
      </tbody></table></div></section>`;
}

/* ---------------- login ---------------- */
function loginView(msg){
  $app.innerHTML = `<div class="login"><div class="login-card">
    <h1>اليوم الدراسي</h1>
    <p>لوحة يومية لإدارة المدرسة تقرأ من بوابة المعلم وبوابة حضور الطالب.</p>
    <form id="lf" autocomplete="off">
      <label for="pw">كلمة مرور لوحة الإدارة في بوابة المعلم (المدير أو الوكيل أو الموجه)</label>
      <input id="pw" type="password" inputmode="text" required ${LIVE_READY?"":"disabled"}>
      <div class="err-msg" id="lerr" role="alert">${esc(msg || (LIVE_READY ? "" : "الربط غير مفعّل: أضف المفتاح العام في قسم الإعدادات أعلى الملف."))}</div>
      <button class="btn primary" type="submit" ${LIVE_READY?"":"disabled"}>دخول</button>
    </form>
    <div class="alt">أو <button type="button" id="demo">جرّب اللوحة ببيانات وهمية</button></div>
  </div></div>`;
  document.getElementById("demo").onclick = () => { S.mode = "demo"; S.token = "demo"; S.role = "admin"; S.name = "مستخدم تجريبي"; ss.set("mode","demo"); boot(); };
  document.getElementById("lf").onsubmit = async ev => {
    ev.preventDefault();
    const btn = ev.target.querySelector("button"), err = document.getElementById("lerr"), pw = document.getElementById("pw");
    btn.disabled = true; err.textContent = "";
    try {
      const r = await rpcLive("pt_admin_login", {p_password: pw.value});
      pw.value = "";
      if(r && r.token){
        S.mode = "live"; S.token = r.token; S.role = r.role; S.name = r.name || "";
        ss.set("mode","live"); ss.set("token", r.token); ss.set("role", r.role); ss.set("name", S.name);
        boot();
      } else {
        err.textContent = r && r.error === "too_many" ? "محاولات كثيرة. انتظر 15 دقيقة ثم أعد المحاولة." : "كلمة المرور غير صحيحة.";
      }
    } catch(e){ err.textContent = "تعذّر الاتصال: " + e.message; }
    btn.disabled = false;
  };
}
async function logout(expired){
  if(S.mode === "live" && S.token && !expired){ try { await rpcLive("pt_logout", {p_token:S.token}); } catch(e){} }
  ["mode","token","role","name"].forEach(k => ss.set(k, null));
  Object.assign(S, {mode:null, token:null, role:null, name:"", t:null, dash:null, gate:null, range:{}});
  loginView(expired ? "انتهت الجلسة، سجّل الدخول من جديد." : "");
}

/* ---------------- render ---------------- */
let renderSeq = 0;
async function render(){
  if(!S.t){ $app.innerHTML = shell(""); bindShell(); return; }
  const seq = ++renderSeq, r = route();
  const pages = {home:pageHome, attendance:pageAttendance, covers:pageCovers, supervision:pageSupervision, behavior:pageBehavior, reports:pageReports};
  let html;
  try { html = await pages[r](); } catch(e){ html = `<div class="notice err">خطأ في عرض الصفحة: ${esc(e.message)}</div>`; if(isUnauth(e)) return logout(true); }
  if(seq !== renderSeq) return;
  const y = window.scrollY;
  $app.innerHTML = shell(html); bindShell();
  if(r === "attendance") bindRangeTools("att-tools", AV, render);
  if(r === "behavior") bindRangeTools("bh-tools", BV, render);
  if(r === "reports") bindRangeTools("rp-tools", RV, () => {
    RV.thLate = Math.max(1, +RV.thLate || 5); RV.thAbs = Math.max(1, +RV.thAbs || 5); RV.onlyFlag = !!RV.onlyFlag && RV.onlyFlag !== "";
    ls.set("thLate", RV.thLate); ls.set("thAbs", RV.thAbs); ls.set("termStart", RV.from); render();
  });
  if(r === "covers") bindRangeTools("cv-tools", CV, render);
  if(r === "supervision") bindRangeTools("sv-tools", SV, render);
  const ae = document.activeElement;
  if(!ae || ae === document.body) window.scrollTo(0, y);
}
window.addEventListener("hashchange", () => { window.scrollTo(0,0); render(); });

async function boot(){
  $app.innerHTML = '<div class="loading">جارٍ قراءة بيانات اليوم…</div>';
  const ok = await loadCore();
  if(ok) render();
}

    announcements:[{id:"n1", sort:0, text:"اجتماع تجريبي للمعلمين بعد الحصة السادسة", from_date:today, until_date:today}],
    periods, periods_all:periods, teachers:T, schedule, duties:[], absences, assignments, holidays:[], rota };
  return { rpc(fn, a){
    if(fn === "pt_admin_data") return data;
    if(fn === "pt_admin_dashboard") return {refs:{total:2,new:1,done:1}, inq:{total:1,sent:1}, notices:1,
      behavior: stu.slice(0,5).map((s,i) => ({name:s.name, class_name:CL[i], n:5-i}))};
    if(fn === "sd_gate_summary"){ const r = recs.filter(x => x.date === a.p_date);
      return { date:a.p_date, role:"admin", counts:{late:r.filter(x=>x.type==="late").length, absent:r.filter(x=>x.type==="absent").length, absent_excused:r.filter(x=>x.type==="absent"&&x.excused).length, violation:r.filter(x=>x.type==="violation").length},
        records:r, rollcalls:[{class:"أول متوسط / 1", total:27, absent:2, by:"موظف تجريبي"},{class:"ثاني متوسط / 1", total:26, absent:1, by:"موظف تجريبي"}], open_referrals:3, violations_config:V }; }
    if(fn === "sd_gate_records") return recs.filter(x => x.date >= a.p_from && x.date <= a.p_to);
    throw new Error("غير متاح في العرض التجريبي");
  }};
})();

/* ---------------- start ---------------- */
(function start(){
  const mode = ss.get("mode");
  if(mode === "demo"){ S.mode = "demo"; S.token = "demo"; S.role = "admin"; S.name = "مستخدم تجريبي"; return boot(); }
  if(mode === "live" && LIVE_READY && ss.get("token")){ S.mode = "live"; S.token = ss.get("token"); S.role = ss.get("role"); S.name = ss.get("name") || ""; return boot(); }
  loginView();
})();
})();
</script>
